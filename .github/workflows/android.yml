name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Permiso de ejecución para gradlew
        run: chmod +x gradlew

      - name: Clave de firma fija de las betas (desde los secretos del repositorio)
        env:
          BETA_KEYSTORE_B64: ${{ secrets.BETA_KEYSTORE_B64 }}
        run: |
          if [ -n "$BETA_KEYSTORE_B64" ]; then
            echo "$BETA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/beta.jks"
            echo "BETA_KEYSTORE_PATH=$RUNNER_TEMP/beta.jks" >> "$GITHUB_ENV"
            echo "Firma fija activada"
          else
            echo "Sin secreto BETA_KEYSTORE_B64: se usa la firma de depuración"
          fi

      - name: Pruebas unitarias
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Compilar APK de pruebas (beta)
        env:
          BETA_KEYSTORE_PASSWORD: ${{ secrets.BETA_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: tu-pedalada-beta-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar informe de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pruebas
          path: app/build/reports/tests/

